name: kipluo
description: Interactive Flutter widgets with spring physics, touch gestures and synthesized spatial sound. Toggles, sliders, charts, loaders and animated icons.
version: 0.1.0
homepage: https://kipluo.com
repository: https://github.com/AngeloGetuaban/flutter-kipluo
issue_tracker: https://github.com/AngeloGetuaban/flutter-kipluo/issues
documentation: https://kipluo.com/docs#flutter
topics: [animation, physics, widget, ui, sound]

environment:
  sdk: ^3.10.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^3.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
